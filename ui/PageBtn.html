<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Page</title>

    <script>
        (function () {
            document.documentElement.classList.add('pre-render');
            document.documentElement.setAttribute('data-theme', 'dark');
        })();

        (function () {
            function checkDividerValidity() {
                const raw = document.documentElement.getAttribute('data-theme');
                const valid = (raw === 'light' || raw === 'dark');
                document.documentElement.classList.toggle('no-divider', !valid);
            }

            try {
                new MutationObserver(checkDividerValidity)
                    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
            } catch (e) { }

            window.addEventListener('DOMContentLoaded', checkDividerValidity);
            checkDividerValidity();

            function applyTheme(theme) {
                theme = (theme === 'light') ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);

                try {
                    window.dispatchEvent(new CustomEvent('themechange', {
                        detail: { theme: theme }
                    }));
                } catch (e) { }

                if (window.chrome && window.chrome.webview) {
                    try {
                        window.chrome.webview.postMessage({
                            action: 'themeChanged',
                            theme: theme
                        });
                    } catch (e) { }
                }
            }

            window.ThemeAPI = {
                setDark: function () {
                    applyTheme('dark');
                },
                setLight: function () {
                    applyTheme('light');
                },
                toggle: function () {
                    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                    applyTheme(cur === 'light' ? 'dark' : 'light');
                },
                getTheme: function () {
                    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                }
            };
        })();
    </script>

    <style>
        :root {
            --bg: transparent;
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-active: rgba(255, 255, 255, 0.9);
            --item-hover: rgba(255, 255, 255, 0.06);
            --item-active: rgba(255, 255, 255, 0.1);
            --divider: rgba(29, 29, 29, 1.0);
            --indicator-color: rgb(250, 250, 250);
            --transition: all 0.2s ease-out;
        }

        [data-theme="light"] {
            --bg: transparent;
            --text-muted: rgba(0, 0, 0, 0.4);
            --text-active: rgba(0, 0, 0, 0.9);
            --item-hover: rgba(0, 0, 0, 0.06);
            --item-active: rgba(0, 0, 0, 0.1);
            --divider: rgba(225, 225, 225, 1.0);
            --indicator-color: rgb(5, 5, 5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
        }

        body {
            display: flex;
            flex-direction: row;
            justify-content: center;
            position: relative;
            forced-color-adjust: none;
        }

        .divider-top,
        .divider-right {
            position: absolute;
            background: var(--divider);
            pointer-events: none;
            z-index: 999999;
        }

        .divider-top {
            top: 0;
            left: 0;
            right: 0;
            height: 0.5px;
        }

        .divider-right {
            top: 0;
            right: 1px;
            bottom: 0;
            width: 1px;
        }

        html.no-divider .divider-top,
        html.no-divider .divider-right {
            display: none;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 10px 0;
            gap: 8px;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 37px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            transition: var(--transition);
            user-select: none;
            flex-shrink: 0;
            text-decoration: none;
        }

            .nav-item svg {
                width: 20px;
                height: 20px;
                stroke: var(--text-muted);
                stroke-width: 2px;
                transition: var(--transition);
            }

            .nav-item:hover svg {
                stroke: var(--text-active);
            }

            .nav-item.active svg {
                stroke: var(--text-active);
            }

            .nav-item svg[fill="currentColor"] {
                color: var(--text-muted);
                stroke: none !important;
            }

            .nav-item:hover svg[fill="currentColor"] {
                color: var(--text-active);
            }

        .active-indicator {
            position: fixed;
            left: 0;
            top: 0;
            width: 3px;
            height: 0;
            background: var(--indicator-color);
            border-radius: 0 2px 2px 0;
            transition: opacity 0.2s ease-out, height 0.25s ease-out;
            transform: translateY(-50%);
            opacity: 0;
            pointer-events: none;
            z-index: 1000000;
        }

            .active-indicator.visible {
                height: 22px;
                opacity: 1;
            }
    </style>
</head>

    <script>
        let currentIndicatorEl = null;

        function createIndicatorEl(top) {
            const el = document.createElement('div');
            el.className = 'active-indicator';
            el.style.top = top + 'px';
            document.body.appendChild(el);
            return el;
        }

        function showIndicatorAt(target) {
            if (!target) return null;
            const rect = target.getBoundingClientRect();
            const top = rect.top + rect.height / 2;
            const el = createIndicatorEl(top);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => el.classList.add('visible'));
            });
            return el;
        }

        function hideAndRemove(el) {
            if (!el) return;
            el.classList.remove('visible');
            setTimeout(() => el.remove(), 260);
        }

        function moveIndicatorTo(target) {
            currentIndicatorEl = showIndicatorAt(target);
        }

        function switchIndicatorTo(target) {
            if (!target) return;
            hideAndRemove(currentIndicatorEl);
            currentIndicatorEl = showIndicatorAt(target);
        }

        function activateTab(tabName, notify) {
            const target = document.querySelector(`.nav-item[data-tab="${tabName}"]`);
            if (!target || target.classList.contains('active')) return false;
            document.querySelector('.nav-item.active')?.classList.remove('active');
            target.classList.add('active');
            if (notify && window.chrome?.webview) window.chrome.webview.postMessage(tabName);

            switchIndicatorTo(target);

            return true;
        }

        document.querySelectorAll('.nav-item[data-tab]').forEach(item => {
            item.addEventListener('click', () => {
                activateTab(item.dataset.tab, true);
            });
        });

        window.NavAPI = {
            setActive: function (tabName) {
                return activateTab(tabName, false);
            },
            getActive: function () {
                return document.querySelector('.nav-item.active')?.dataset.tab || null;
            }
        };

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                document.documentElement.classList.remove('pre-render');
                moveIndicatorTo(document.querySelector('.nav-item.active'));
            });
        });

        window.addEventListener('resize', () => {
            const active = document.querySelector('.nav-item.active');
            if (active && currentIndicatorEl) {
                const rect = active.getBoundingClientRect();
                currentIndicatorEl.style.top = (rect.top + rect.height / 2) + 'px';
            }
        });
    </script>
