    <script>
        (function () {
            try {
                var saved = localStorage.getItem('app_theme');
                var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();

        (function () {
            function applyTheme(theme) {
                theme = (theme === 'light') ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                try {
                    localStorage.setItem('app_theme', theme);
                } catch (e) { }

                try {
                    window.dispatchEvent(new CustomEvent('themechange', {
                        detail: { theme: theme }
                    }));
                } catch (e) { }

                if (window.chrome && window.chrome.webview) {
                    try {
                        window.chrome.webview.postMessage({
                            action: 'themeChanged',
                            theme: theme
                        });
                    } catch (e) { }
                }
            }

            window.ThemeAPI = {
                setDark: function () { applyTheme('dark'); },
                setLight: function () { applyTheme('light'); },
                toggle: function () {
                    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                    applyTheme(cur === 'light' ? 'dark' : 'light');
                },
                getTheme: function () {
                    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                }
            };
        })();
    </script>

        /* ===== Shared Notification Module (synced from Executor) ===== */
        :root {
            --notif-bg: #ffffff;
            --notif-text: #111111;
            --notif-shadow-soft: rgba(0, 0, 0, 0.25);
            --notif-shadow-strong: rgba(0, 0, 0, 0.3);
            --notif-inset: rgba(0, 0, 0, 0.02);
            --notif-track: rgba(0, 0, 0, 0.12);
        }

        [data-theme="light"] {
            --notif-bg: rgba(0, 0, 0, 1.0);
            --notif-text: rgba(238, 238, 238, 1.0);
            --notif-shadow-soft: rgba(0, 0, 0, 0.25);
            --notif-shadow-strong: rgba(0, 0, 0, 0.3);
            --notif-inset: rgba(0, 0, 0, 0.02);
            --notif-track: rgba(255, 255, 255, 0.12);
        }

        #notification-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            width: max-content;
            z-index: 9999;
            pointer-events: none;
        }

            #notification-container.has-items {
                pointer-events: auto;
            }

        .notification {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: max-content;
            box-sizing: border-box;
            min-width: 160px;
            max-width: 320px;
            padding: 14px 22px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--notif-bg);
            border: none;
            box-shadow: 0 10px 30px var(--notif-shadow-soft), inset 0 1px 0 var(--notif-inset);
            color: var(--notif-text);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.3;
            letter-spacing: 0;

            transform: translate(-50%, 40px);
            z-index: 1;
            overflow: hidden;
            will-change: transform, opacity;
            transition: transform 0.58s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
        }

        .notification.show {
            z-index: 30;
            box-shadow: 0 16px 36px var(--notif-shadow-strong), inset 0 1px 0 var(--notif-inset);
        }

        #notification-container:not(.expanded) .notification.show[data-depth="1"] {
            z-index: 20;
        }

        #notification-container:not(.expanded) .notification.show[data-depth="2"] {
            z-index: 10;
        }

        .notification.hide {
            pointer-events: none;
            transition: opacity 0.45s ease-out;
        }

        #notification-container.expanded .notification.show {
            z-index: 30;
        }
        /* ===== End Shared Notification Module ===== */

        /* ===== Shared Progress Notification (synced from Executor) ===== */
        .notification.has-progress {
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            border-radius: 22px;
            min-width: 260px;
        }

            .notification.has-progress::before,
            .notification.has-progress::after {
                border-radius: 22px;
            }

        .notif-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notification-progress-container {
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-progress-track {
            flex: 1;
            height: 4px;
            background: var(--notif-track);
            border-radius: 999px;
            overflow: hidden;
        }

        .notification-progress-fill {
            width: 0%;
            height: 100%;
            background: var(--notif-text);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .notification-progress-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--notif-text);
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            min-width: 30px;
            text-align: right;
        }
        /* ===== End Shared Progress Notification ===== */

</style>

    <script>
        const grid = document.getElementById("grid");

        const API_SOURCES = {
            rscripts: {
                id: "rscripts",
                name: "Rscripts",
                domain: "rscripts.net",
                homepage: "https://rscripts.net",
                logo: "https://rscripts.net/favicon.ico",
                logoFallback: "https://www.google.com/s2/favicons?domain=rscripts.net&sz=64",
            },
            scriptblox: {
                id: "scriptblox",
                name: "ScriptBlox",
                domain: "scriptblox.com",
                homepage: "https://scriptblox.com",
                logo: "https://scriptblox.com/favicon.ico",
                logoFallback: "https://www.google.com/s2/favicons?domain=scriptblox.com&sz=64",
            },
            robloxscripts: {
                id: "robloxscripts",
                name: "RobloxScripts.com",
                domain: "robloxscripts.com",
                homepage: "https://robloxscripts.com",
                logo: "https://robloxscripts.com/images/1769716787486-688166844.png",
                logoFallback: "https://www.google.com/s2/favicons?domain=robloxscripts.com&sz=64",
            },
        };

        const API_SOURCES_KEY = "rscripts_api_sources_v1";
        function loadSelectedSources() {
            try {
                const raw = JSON.parse(localStorage.getItem(API_SOURCES_KEY));
                if (Array.isArray(raw) && raw.length) {
                    return new Set(raw.filter(id => API_SOURCES[id]));
                }
            } catch { }
            return new Set(Object.keys(API_SOURCES).filter(id => !API_SOURCES[id].unstable));
        }
        let selectedApiSources = loadSelectedSources();
        function saveSelectedSources() {
            try { localStorage.setItem(API_SOURCES_KEY, JSON.stringify([...selectedApiSources])); } catch { }
        }

        function mapOrderBy(orderBy) {
            return orderBy === "views" ? "views" : orderBy === "likes" ? "likes" : "date";
        }

        async function fetchWithTimeout(url, ms = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                return await fetch(url, { signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchRscripts(opts) {
            const params = new URLSearchParams({
                page: opts.page,
                orderBy: mapOrderBy(opts.orderBy),
                sort: opts.order || "desc",
            });
            if (opts.query) params.set("q", opts.query);
            if (opts.noKey) params.set("noKeySystem", "true");
            if (opts.unpatched) params.set("unpatched", "true");
            if (opts.verifiedOnly) params.set("verifiedOnly", "true");
            const url = `https://rscripts.net/api/v2/scripts?${params.toString()}`;
            try {
                const res = await fetchWithTimeout(url);
                const data = await res.json();
                const scripts = (data.scripts || []).map(s => ({ ...s, _id: `rscripts:${s._id}`, _source: "rscripts" }));
                const hasMore = !!(data.info && opts.page < data.info.maxPages) && scripts.length > 0;
                return { scripts, hasMore };
            } catch { return { scripts: [], hasMore: false }; }
        }

        async function fetchScriptBlox(opts) {
            const sortByMap = { date: "updatedAt", views: "views", likes: "likeCount" };
            const params = new URLSearchParams({
                page: opts.page,
                max: 20,
                sortBy: sortByMap[mapOrderBy(opts.orderBy)] || "updatedAt",
                order: opts.order || "desc",
            });
            if (opts.noKey) params.set("key", "0");
            if (opts.verifiedOnly) params.set("verified", "1");
            if (opts.unpatched) params.set("patched", "0");
            const base = opts.query
                ? `https://scriptblox.com/api/script/search?q=${encodeURIComponent(opts.query)}&`
                : `https://scriptblox.com/api/script/fetch?`;
            const url = base + params.toString();
            try {
                const res = await fetchWithTimeout(url);
                const data = await res.json();
                const list = data.result?.scripts || [];
                const scripts = list.map(s => ({
                    _id: `scriptblox:${s._id}`,
                    _source: "scriptblox",
                    title: s.title,
                    image: s.image ? (s.image.startsWith("http") ? s.image : `https://scriptblox.com${s.image}`) : "",
                    game: { title: s.game?.name, imgurl: s.game?.imageUrl ? (s.game.imageUrl.startsWith("http") ? s.game.imageUrl : `https://scriptblox.com${s.game.imageUrl}`) : "" },
                    scriptCode: s.script || "",
                    views: s.views || 0,
                    likes: 0,
                    keySystem: !!s.key,
                    mobileReady: false,
                    isPatched: !!s.isPatched,
                    user: { username: "", verified: !!s.verified },
                    createdAt: s.createdAt,
                    description: "",
                }));
                const hasMore = !!(data.result && opts.page < data.result.totalPages) && scripts.length > 0;
                return { scripts, hasMore };
            } catch { return { scripts: [], hasMore: false }; }
        }

        async function fetchRobloxScripts(opts) {
            const sortMap = {
                date: opts.order === "asc" ? "oldest" : "newest",
                views: "most-viewed",
                likes: "most-liked",
            };
            const params = new URLSearchParams({
                page: opts.page,
                limit: 24,
                sort: sortMap[mapOrderBy(opts.orderBy)] || "newest",
            });
            if (opts.query) params.set("q", opts.query);
            if (opts.noKey) params.set("access", "free");
            if (opts.verifiedOnly) params.set("verified", "true");
            const url = `https://robloxscripts.com/api/v1/scripts?${params.toString()}`;
            try {
                const res = await fetchWithTimeout(url);
                const data = await res.json();
                const list = data.data || [];
                const scripts = list.map(s => ({
                    _id: `robloxscripts:${s.id}`,
                    _source: "robloxscripts",
                    title: s.title,
                    image: s.image || "",
                    game: { title: s.game?.name, imgurl: s.game?.iconUrl || "" },
                    scriptCode: s.script || "",
                    rawScript: s.rawScriptUrl || "",
                    views: s.views || 0,
                    likes: s.likes || 0,
                    keySystem: !!s.key,
                    mobileReady: false,
                    isPatched: false,
                    user: { username: s.author?.username || "", verified: !!s.author?.verified },
                    createdAt: s.createdAt,
                    description: s.description || "",
                }));
                const totalPages = data.pagination?.totalPages || data.pagination?.pages || null;
                const hasMore = totalPages ? opts.page < totalPages : scripts.length >= 24;
                return { scripts, hasMore };
            } catch { return { scripts: [], hasMore: false }; }
        }

        const SOURCE_ADAPTERS = {
            rscripts: fetchRscripts,
            scriptblox: fetchScriptBlox,
            robloxscripts: fetchRobloxScripts,
        };

        async function fetchFromSelectedSources(opts, sourceStateMap) {
            const ids = [...selectedApiSources].filter(id => sourceStateMap[id]?.hasMore !== false);
            const results = await Promise.all(ids.map(async id => {
                const state = sourceStateMap[id];
                const response = await SOURCE_ADAPTERS[id]({ ...opts, page: state.page, cursor: state.cursor });
                state.page += 1;
                state.hasMore = response.hasMore;
                if (response.cursor !== undefined) state.cursor = response.cursor;
                return response.scripts;
            }));
            return results.flat();
        }

        async function fetchRowSourcesPage1(opts) {
            const ids = [...selectedApiSources];
            const results = await Promise.all(ids.map(id => SOURCE_ADAPTERS[id]({ ...opts, page: 1 })));
            return results.flatMap(r => r.scripts);
        }

        function makeSourceState() {
            const state = {};
            Object.keys(API_SOURCES).forEach(id => { state[id] = { page: 1, hasMore: true }; });
            return state;
        }

        function anySourceHasMore(sourceStateMap) {
            return [...selectedApiSources].some(id => sourceStateMap[id]?.hasMore !== false);
        }

        function replayContentAnimation() {
            const target = isHomeMode
                ? document.getElementById("homeView")
                : document.getElementById("grid");

            if (!target) return;

            target.style.transition = "none";
            target.style.opacity = "0";
            target.style.transform = "translateY(16px)";

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    target.style.transition = "opacity .35s var(--easing), transform .35s var(--easing)";
                    target.style.opacity = "1";
                    target.style.transform = "translateY(0)";

                    setTimeout(() => {
                        target.style.transition = "";
                    }, 350);
                });
            });
        }

        function removeDuplicateScripts(scripts) {
            const seen = new Set();

            return scripts.filter(script => {
                const title = String(script.title || "")
                    .trim()
                    .toLowerCase();

                const game = typeof script.game === "string"
                    ? script.game
                    : (script.game?.title || script.game?.name || "");

                const gameTitle = String(game)
                    .trim()
                    .toLowerCase();

                const key = `${title}|${gameTitle}`;

                if (seen.has(key)) {

            const MAX_TRIES = 60;

                const backfillPool = removeDuplicateScripts(allFetched)
                    .filter(s => !already.has(s._id))

        function escapeHtml(str) {
            return String(str || "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function formatDescriptionHtml(text) {
            const raw = String(text || "").replace(/\r\n|\r/g, "\n");
            const rawLines = raw.split("\n").map(l => l.trim());

            const blocks = [];
            let current = [];
            for (const line of rawLines) {
                if (line === "") {
                    if (current.length) { blocks.push(current); current = []; }
                } else {
                    current.push(line);
                }
            }
            if (current.length) blocks.push(current);
            if (!blocks.length) return "";

            const bulletRe = /^(?:[-*•‣▪]|\d+[.)]|[a-zA-Z][.)])\s+/;
            const stripBullet = line => line.replace(bulletRe, "").trim();

            const html = blocks.map(blockLines => {
                const bulletCount = blockLines.filter(l => bulletRe.test(l)).length;
                const isList = blockLines.length > 1 && bulletCount >= Math.ceil(blockLines.length * 0.6);

                if (isList) {
                    const items = blockLines
                        .filter(l => l.length > 0)
                        .map(l => `<li>${escapeHtml(stripBullet(l))}</li>`)
                        .join("");
                    return `<ul>${items}</ul>`;
                }

                const merged = [];
                let para = "";
                for (const line of blockLines) {
                    para = para ? `${para} ${line}` : line;
                    if (/[.!?。！？]["')\]]?$/.test(line)) {
                        merged.push(para);
                        para = "";
                    }
                }
                if (para) merged.push(para);

                return merged
                    .map(p => `<p class="modal-desc-para">${escapeHtml(p)}</p>`)
                    .join("");
            }).join("");

            return html;
        }

Rewrite the following raw text into clean, readable HTML using only <p>, <ul>, <li>, <strong>, and <br> tags.
Rules:
- Do NOT add, remove, or change any factual content — only reformat.
- Stay minimal: most descriptions should just become 1-3 short <p> paragraphs.
- Only use <ul><li> if the text is CLEARLY a list of 3+ separate features/steps (e.g. already has bullet/dash/numbered lines). Do not invent a list from ordinary prose.
- Only use <strong> for a couple of truly key terms (script name, standout feature, warnings). Do not bold generic words.
- Output ONLY the raw HTML fragment. No markdown fences, no commentary, no <html>/<body> tags.

Text to format:
"""
${rawText}
"""`;

            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "claude-sonnet-4-6",

                })
            });

            if (!response.ok) throw new Error("format api failed: " + response.status);

        const LUA_FLOW_KEYWORDS = new Set([
            "and", "break", "do", "else", "elseif", "end", "for", "goto", "if",
            "in", "not", "or", "repeat", "return", "then", "until", "while"
        ]);
        const LUA_DECL_KEYWORDS = new Set(["function", "local"]);
        const LUA_CONSTANTS = new Set(["true", "false", "nil"]);
        const LUA_BUILTINS = new Set([
            "game", "workspace", "script", "Instance", "wait", "task", "print", "warn",
            "error", "pairs", "ipairs", "pcall", "xpcall", "spawn", "delay", "tick",
            "tostring", "tonumber", "require", "loadstring", "Enum", "Vector2", "Vector3",
            "CFrame", "Color3", "UDim2", "UDim", "Ray", "Region3", "math", "string",

            "setmetatable", "getmetatable", "shared", "_G", "self"

        function highlightLuaCode(code) {
            const src = String(code || "");
            const pattern = /(?<comment>--\[(?<ceq>=*)\[[\s\S]*?\]\k<ceq>\]|--[^\n]*)|(?<string>"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(?<longstring>\[(?<seq>=*)\[[\s\S]*?\]\k<seq>\])|(?<number>\b0x[0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|(?<word>[A-Za-z_][A-Za-z0-9_]*)/g;

            let out = "";
            let lastIndex = 0;
            let m;
            while ((m = pattern.exec(src)) !== null) {
                out += escapeHtml(src.slice(lastIndex, m.index));
                const g = m.groups;
                if (g.comment) {
                    out += `<span class="tok-comment">${escapeHtml(g.comment)}</span>`;
                } else if (g.string) {
                    out += `<span class="tok-string">${escapeHtml(g.string)}</span>`;
                } else if (g.longstring) {
                    out += `<span class="tok-string">${escapeHtml(g.longstring)}</span>`;
                } else if (g.number) {
                    out += `<span class="tok-number">${escapeHtml(g.number)}</span>`;
                } else if (g.word) {
                    const w = g.word;
                    if (LUA_FLOW_KEYWORDS.has(w)) {
                        out += `<span class="tok-keyword">${w}</span>`;
                    } else if (LUA_DECL_KEYWORDS.has(w)) {
                        out += `<span class="tok-decl">${w}</span>`;
                    } else if (LUA_CONSTANTS.has(w)) {
                        out += `<span class="tok-constant">${w}</span>`;
                    } else if (LUA_BUILTINS.has(w)) {
                        out += `<span class="tok-builtin">${w}</span>`;
                    } else if (src[pattern.lastIndex] === "(") {
                        out += `<span class="tok-function">${w}</span>`;
                    } else {
                        out += w;
                    }
                }
                lastIndex = pattern.lastIndex;
            }
            out += escapeHtml(src.slice(lastIndex));
            return out;
        }

        function normalizeSearchText(str) {
            return String(str || "")
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[^a-z0-9\u4e00-\u9fff]+/g, " ")
                .trim()
                .replace(/\s+/g, " ");
        }

        function queryTokens(query) {
            return normalizeSearchText(query).split(" ").filter(Boolean);
        }

        function scriptSearchHaystack(script) {
            const game = typeof script.game === "string" ? script.game : (script.game?.title || script.game?.name || "");
            return normalizeSearchText(`${script.title || ""} ${game} ${script.description || ""}`);
        }

        function relevanceScore(script, tokens) {
            if (!tokens.length) return 0;
            const haystack = scriptSearchHaystack(script);
            const titleNorm = normalizeSearchText(script.title || "");
            let score = 0;
            for (const token of tokens) {
                if (!haystack.includes(token)) return null; 
                if (titleNorm.includes(token)) score += 2;
                if (titleNorm.startsWith(token)) score += 3;
            }
            if (titleNorm === normalizeSearchText(tokens.join(" "))) score += 10;
            return score;
        }

        function filterByRelevance(scripts, rawQuery) {
            const tokens = queryTokens(rawQuery);
            if (!tokens.length) return scripts;
            return scripts
                .map(s => ({ s, score: relevanceScore(s, tokens) }))
                .filter(x => x.score !== null)
                .sort((a, b) => b.score - a.score)
                .map(x => x.s);
        }

        function toBigrams(str) {
            const s = str.replace(/\s+/g, "");
            const grams = [];
            for (let i = 0; i < s.length - 1; i++) grams.push(s.substring(i, i + 2));
            return grams;
        }

        function stringSimilarity(a, b) {
            if (!a || !b) return 0;
            if (a === b) return 1;
            const gramsA = toBigrams(a);
            const gramsB = toBigrams(b);
            if (!gramsA.length || !gramsB.length) return a.includes(b) || b.includes(a) ? 0.9 : 0;
            const counts = new Map();
            for (const g of gramsA) counts.set(g, (counts.get(g) || 0) + 1);
            let matches = 0;
            for (const g of gramsB) {
                const c = counts.get(g) || 0;
                if (c > 0) { matches++; counts.set(g, c - 1); }
            }
            return (2 * matches) / (gramsA.length + gramsB.length);
        }

        function gameNameMatches(gameNorm, queryNorm, queryTokensArr) {
            if (!gameNorm || !queryNorm) return false;
            if (gameNorm.includes(queryNorm) || queryNorm.includes(gameNorm)) return true;

            const gameTokensArr = gameNorm.split(" ").filter(Boolean);
            if (queryTokensArr.length && gameTokensArr.length) {
                const matchedQueryTokens = queryTokensArr.filter(t => gameNorm.includes(t)).length;
                const matchedGameTokens = gameTokensArr.filter(t => queryNorm.includes(t)).length;
                const queryCoverage = matchedQueryTokens / queryTokensArr.length;
                const gameCoverage = matchedGameTokens / gameTokensArr.length;
                if (queryCoverage >= 0.6 || gameCoverage >= 0.6) return true;
            }

            return stringSimilarity(gameNorm, queryNorm) >= 0.55;
        }

        function filterByGame(scripts, gameQuery) {
            const tokens = queryTokens(gameQuery);
            if (!tokens.length) return scripts;
            const queryNorm = normalizeSearchText(gameQuery);
            return scripts.filter(s => {
                const game = typeof s.game === "string" ? s.game : (s.game?.title || s.game?.name || "");
                const gameNorm = normalizeSearchText(game);
                return gameNameMatches(gameNorm, queryNorm, tokens);
            });
        }

                scripts = scripts.filter(s => s.user?.verified === true);

            if (currentFilters.cat !== 'all') {
                const CAT_KEYWORDS = {

                const kws = CAT_KEYWORDS[currentFilters.cat] || [];
                scripts = scripts.filter(s => {

            if (currentFilters.age !== 'all') {

                const AGE_MS = { today: 86400000, week: 604800000, month: 2592000000, year: 31536000000 };
                const ms = AGE_MS[currentFilters.age];
                if (ms) scripts = scripts.filter(s => {

        async function executeSearch(append = false) {
            if (isLoading) return;
            isLoading = true;

            const rawQuery = document.getElementById("searchInput").value.trim();
            const query = rawQuery;

            document.getElementById("grid").classList.add("search-grid");

            if (!append) {
                searchSourceState = makeSourceState();
                hasMore = true;
                showSkeletons(20);
                document.body.scrollTo({ top: 0, left: 0, behavior: "auto" });
            }

            let collected = [];
            let tries = 0;

            const opts = {
                orderBy: currentFilters.orderBy,
                order: currentFilters.order,
                query,
                noKey: currentFilters.key === "free",
                unpatched: currentFilters.patched === "unpatched",
                verifiedOnly: currentFilters.safe === "verified",
            };

            while (collected.length < 20 && anySourceHasMore(searchSourceState) && tries < 4) {
                try {
                    let scripts = applyFilters(await fetchFromSelectedSources(opts, searchSourceState));
                    scripts = filterByGame(scripts, gameFilter);
                    scripts = filterByRelevance(scripts, rawQuery);
                    collected.push(...scripts);
                } catch (err) {
                    console.error("Fetch Data Pipeline Exception:", err);
                    break;
                }
                tries++;
            }

            hasMore = anySourceHasMore(searchSourceState);

            collected = removeDuplicateScripts(collected);

            const activeTokens = queryTokens(rawQuery);
            const scoreCache = new Map();
            const getScore = (s) => {
                if (!scoreCache.has(s)) scoreCache.set(s, relevanceScore(s, activeTokens) || 0);
                return scoreCache.get(s);
            };

            collected.sort((a, b) => {
                const dir = currentFilters.order === "asc" ? 1 : -1;
                const key = currentFilters.orderBy === "views" ? "views" : currentFilters.orderBy === "likes" ? "likes" : "createdAt";
                const av = key === "createdAt" ? new Date(a[key] || 0).getTime() : (a[key] || 0);
                const bv = key === "createdAt" ? new Date(b[key] || 0).getTime() : (b[key] || 0);
                if (activeTokens.length) {
                    const sa = getScore(a), sb = getScore(b);
                    if (sa !== sb) return sb - sa;
                }
                return av > bv ? dir : av < bv ? -dir : 0;
            });

            renderScripts(collected, append);
            isLoading = false;
        }

        function setupDescToggle(lang) {

            const labelMore = lang === "zh" ? "顯示更多" : "Show more";
            const labelLess = lang === "zh" ? "顯示較少" : "Show less";
            toggle.textContent = labelMore;
            toggle.dataset.labelMore = labelMore;
            toggle.dataset.labelLess = labelLess;

            toggle.onclick = () => {
                const isExpanded = box.classList.contains("expanded");
                if (!isExpanded) {
                    box.style.maxHeight = box.scrollHeight + "px";
                    box.classList.add("expanded");
                    toggle.textContent = labelLess;
                } else {
                    box.style.maxHeight = box.scrollHeight + "px";

            const originalSvgHtml = svg ? svg.outerHTML : "";
            const originalLabelText = label ? label.textContent : "";

            const checkSvg = `<svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"></path></svg>`;

            if (svg) svg.outerHTML = checkSvg;
            btn.classList.add("copied");
            if (label) {
                const zh = (window.currentLang === "zh");
                label.textContent = zh ? "已複製！" : "Copied!";
            }

            setTimeout(() => {
                const currentSvg = btn.querySelector("svg");
                if (currentSvg && originalSvgHtml) currentSvg.outerHTML = originalSvgHtml;
                btn.classList.remove("copied");
                if (label) label.textContent = originalLabelText;
                btn.dataset.copyAnimating = "0";
            }, 1500);
        }

        function spotlightGoTo(idx, userTriggered) {
            const n = spotlightState.scripts.length;
            if (!n) return;
            const prevIndex = spotlightState.index;
            const nextIndex = ((idx % n) + n) % n;
            if (nextIndex === prevIndex) { if (userTriggered) startSpotlightAutoplay(); return; }

            // forward = incoming slide slides in from the right, outgoing exits to the left
            const diffFwd = (nextIndex - prevIndex + n) % n;
            const forward = n <= 2 ? true : diffFwd <= n / 2;

            spotlightState.index = nextIndex;
            const host = document.getElementById("spotlightHero");
            if (!host) return;
            const slides = host.querySelectorAll(".spotlight-slide");

            slides.forEach((el, i) => {
                if (i === nextIndex) {
                    // stage it on the side it should enter from, with no transition
                    el.classList.remove("active", "prev");
                    el.classList.add("next-queued");
                    if (!forward) el.style.transform = "translateX(-100%)";
                } else if (i === prevIndex) {
                    // will animate out via transition when we flip the classes below
                } else {
                    el.classList.remove("active", "prev", "next-queued");
                }
            });

            // force reflow so the staged starting position is committed before animating
            void host.offsetWidth;

            slides.forEach((el, i) => {
                if (i === nextIndex) {
                    el.classList.remove("next-queued");
                    el.style.transform = "";
                    el.classList.add("active");
                } else if (i === prevIndex) {
                    el.classList.remove("active");
                    if (forward) {
                        el.classList.add("prev");
                    } else {
                        el.classList.remove("prev");
                        el.style.transform = "translateX(100%)";
                        el.style.visibility = "visible";
                        setTimeout(() => { el.style.transform = ""; el.style.visibility = ""; }, 650);
                    }
                }
            });

            host.querySelectorAll(".spotlight-dot").forEach((el, i) => {
                el.classList.toggle("active", i === nextIndex);
            });
            if (userTriggered) startSpotlightAutoplay();
        }

        function spotlightNav(dir) {
            spotlightGoTo(spotlightState.index + dir, true);
        }

            if (spotlightState.timer) clearInterval(spotlightState.timer);
            if (spotlightState.scripts.length <= 1) return;

        function startRowAutoScroll(track, originalWidth) {
            if (track._autoScrollCleanup) track._autoScrollCleanup();

            const wrap = track.closest(".row-scroll-wrap");
            if (!wrap) return;
            if (!originalWidth || originalWidth <= track.clientWidth + 4) return;

            const INTERVAL_MS = 4000;
            const PAGE_PX = 600;
            let paused = false;
            let settleTimer = null;

            function normalize() {
                // Once we've scrolled into the cloned (duplicate) region, silently
                // rewind by one original-list-width. The clone is visually identical
                // to the start, so the jump is invisible and the motion always reads
                // as continuing to the right.
                if (track.scrollLeft >= originalWidth) {
                    track.scrollLeft -= originalWidth;
                }
                updateRowFade(track);
            }

            function onScroll() {
                clearTimeout(settleTimer);
                settleTimer = setTimeout(normalize, 80);
            }

            function advance() {
                if (paused) return;
                track.scrollBy({ left: PAGE_PX, behavior: "smooth" });
            }

            function onEnter() {
                paused = true;
            }
            function onLeave() {
                paused = false;
            }

            track.addEventListener("scroll", onScroll);
            wrap.addEventListener("mouseenter", onEnter);
            wrap.addEventListener("mouseleave", onLeave);
            const timerId = setInterval(advance, INTERVAL_MS);

            track._autoScrollCleanup = () => {
                clearInterval(timerId);
                clearTimeout(settleTimer);
                track.removeEventListener("scroll", onScroll);
                wrap.removeEventListener("mouseenter", onEnter);
                wrap.removeEventListener("mouseleave", onLeave);
            };
        }

        function updateRowFade(track) {
            if (!track) return;
            const maxScroll = track.scrollWidth - track.clientWidth;
            const overflowing = maxScroll > 2;
            if (!overflowing) {
                track.classList.remove("fade-left", "fade-right");
                return;
            }
            track.classList.toggle("fade-left", track.scrollLeft > 2);
            track.classList.toggle("fade-right", track.scrollLeft < maxScroll - 2);
        }

        function initRowFade(track) {
            if (!track || track._fadeInit) return;
            track._fadeInit = true;
            const onScroll = () => updateRowFade(track);
            track.addEventListener("scroll", onScroll, { passive: true });
            const ro = new ResizeObserver(() => updateRowFade(track));
            ro.observe(track);
            updateRowFade(track);
        }

        async function fetchRowScripts(params) {
            const cacheKey = `rscripts_row_v2_${[...selectedApiSources].sort().join(",")}_${JSON.stringify(params)}`;
            const TTL = 10 * 60 * 1000;
            try {
                const cached = JSON.parse(localStorage.getItem(cacheKey));
                if (cached && Date.now() - cached.ts < TTL) return cached.data;
            } catch { }

            const opts = {
                orderBy: params.orderBy || "date",
                order: params.sort || "desc",
                noKey: params.noKeySystem === "true",
                unpatched: params.unpatched === "true",
                verifiedOnly: params.verifiedOnly === "true",
            };
            const state = makeSourceState();
            let scripts = await fetchRowSourcesPage1(opts);

            if (params.mobileOnly === "true") {
                scripts = scripts.filter(s => s.mobileReady === true);
            }

            scripts.sort((a, b) => {
                const dir = opts.order === "asc" ? 1 : -1;
                const key = opts.orderBy === "views" ? "views" : opts.orderBy === "likes" ? "likes" : "createdAt";
                const av = key === "createdAt" ? new Date(a[key] || 0).getTime() : (a[key] || 0);
                const bv = key === "createdAt" ? new Date(b[key] || 0).getTime() : (b[key] || 0);
                return av > bv ? dir : av < bv ? -dir : 0;
            });
            scripts = scripts.slice(0, 20);

            try { localStorage.setItem(cacheKey, JSON.stringify({ data: scripts, ts: Date.now() })); } catch { }
            return scripts;
        }

                }
                firstLoad = false;
                return;
            }

            document.querySelectorAll(".sidebar-tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "browse"));
            await renderHomeContent();
        }

        function renderFavoritesRow() {
            const homeView = document.getElementById("homeView");
            if (!homeView || document.getElementById("row-favorites")) return;

            const siblings = Array.from(homeView.children);
            const firstRects = siblings.map(el => el.getBoundingClientRect());

            const section = makeSkeletonRow({ id: "favorites", paramKey: "row_favorites" });
            section.classList.add("row-section-enter");
            const spotlightEl = document.getElementById("spotlightHero");
            if (spotlightEl && spotlightEl.parentElement === homeView) {
                spotlightEl.insertAdjacentElement("afterend", section);
            } else {
                homeView.prepend(section);
            }
            fillRow({ id: "favorites" }, getFavoritesList());

            siblings.forEach((el, i) => {
                const lastRect = el.getBoundingClientRect();
                const deltaY = firstRects[i].top - lastRect.top;
                if (deltaY) {
                    el.style.transition = "none";
                    el.style.transform = `translateY(${deltaY}px)`;
                }
            });

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    siblings.forEach(el => {
                        el.style.transition = "transform 0.6s var(--easing)";
                        el.style.transform = "";
                    });
                    section.classList.add("row-section-enter-active");
                });
            });

            section.addEventListener("transitionend", () => {
                section.classList.remove("row-section-enter", "row-section-enter-active");
            }, { once: true });

            setTimeout(() => {
                siblings.forEach(el => {
                    el.style.transition = "";
                    el.style.transform = "";
                });
            }, 650);
        }
        function resetFilters() {
            document.getElementById("searchInput").value = "";
            document.getElementById("gameSearch").value = "";
            gameFilter = "";
            currentFilters = { orderBy: 'date', order: 'desc', key: 'all', paid: 'all', mobile: 'all', patched: 'all', safe: 'all', cat: 'all', age: 'all' };

            document.querySelectorAll(".fp-cat-chip").forEach(c => c.classList.toggle("active", c.dataset.val === "all"));
            document.querySelectorAll(".fp-segmented .fp-seg-btn").forEach(b => b.classList.toggle("active", b.dataset.val === "date"));
            document.querySelectorAll(".fp-toggle-pair .fp-toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.val === "desc"));
            document.querySelectorAll(".fp-pill-row .fp-pill").forEach(p => p.classList.toggle("active", p.dataset.val === "all"));
            document.querySelectorAll(".fp-switch-item").forEach(item => {
                const allOpt = item.querySelector('.fp-tri-opt[data-val="all"]');
                item.querySelectorAll(".fp-tri-opt").forEach(o => o.classList.remove("active"));
                allOpt?.classList.add("active");
                const sub = item.querySelector(".fp-switch-sub");
                if (sub && allOpt) sub.textContent = allOpt.title;
            });
            updateFilterCountBadge();
            currentSidebarTab = "browse";
            document.querySelectorAll(".sidebar-tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "browse"));
            renderHome();
        }
    </script>
    <div id="notification-container"></div>
    <script>
        (function () {
            const MAX_VISIBLE_NOTIFICATIONS = 3;
            const DEPTH_Y = [0, -16, -28, -38, -46];
            const DEPTH_SCALE = [1, 0.94, 0.88, 0.84, 0.80];
            let currentLoadingToast = null;

            function applyNotifStyles(el, y, scale, opacity) {
                const o = Math.max(0, Math.min(1, opacity));
                el.style.transform = `translate(-50%, ${y.toFixed(2)}px) scale(${scale})`;
                el.style.opacity = o;
            }

            function moveNotification(el, { y, scale, opacity }, { instant = false } = {}) {
                if (instant) {
                    el.style.transition = 'none';
                    applyNotifStyles(el, y, scale, opacity);
                    void el.offsetHeight;
                    el.style.transition = '';
                    return;
                }
                applyNotifStyles(el, y, scale, opacity);
            }

            function primeNotificationEntrance(el) {
                moveNotification(el, { y: 40, scale: 1, opacity: 0 }, { instant: true });
            }

            function restackNotifications() {
                const container = document.getElementById('notification-container');
                const items = [...container.querySelectorAll('.notification')].filter(el => !el.dataset.removing);
                container.classList.toggle('has-items', items.length > 0);
                const ordered = items.slice().reverse();
                const isExpanded = container.classList.contains('expanded');
                ordered.forEach((item, depth) => {
                    if (depth < MAX_VISIBLE_NOTIFICATIONS) {
                        item.dataset.depth = depth;
                        item.classList.add('show');
                        if (!isExpanded) moveNotification(item, { y: DEPTH_Y[depth], scale: DEPTH_SCALE[depth], opacity: 1 });
                    } else {
                        dismissNotification(item);
                    }
                });
                if (isExpanded) applyExpandedLayout();
            }

            function applyExpandedLayout() {
                const container = document.getElementById('notification-container');
                const items = [...container.querySelectorAll('.notification.show')]
                    .filter(el => !el.dataset.removing)
                    .sort((a, b) => parseInt(a.dataset.depth) - parseInt(b.dataset.depth));
                const ITEM_SPACING = 10;
                let offset = 0;
                items.forEach(item => {
                    moveNotification(item, { y: -offset, scale: 1, opacity: 1 });
                    offset += item.offsetHeight + ITEM_SPACING;
                });
            }

            function clearExpandedLayout() {
                const container = document.getElementById('notification-container');
                const items = [...container.querySelectorAll('.notification.show')].filter(el => !el.dataset.removing);
                items.forEach(item => {
                    const depth = parseInt(item.dataset.depth || '0', 10);
                    moveNotification(item, { y: DEPTH_Y[depth] ?? 0, scale: DEPTH_SCALE[depth] ?? 1, opacity: 1 });
                });
            }

            function dismissNotification(item) {
                if (!item || item.dataset.removing) return;
                item.dataset.removing = '1';
                item.classList.remove('show');
                item.classList.add('hide');
                item.style.opacity = 0;
                restackNotifications();
                setTimeout(() => { item.remove(); }, 460);
            }

            function showNotification(message, isError = false) {
                const container = document.getElementById('notification-container');
                if (!container) return;

                if (currentLoadingToast) {
                    dismissNotification(currentLoadingToast);
                    currentLoadingToast = null;
                }

                const toast = document.createElement('div');
                toast.className = 'notification';

                let icon;
                if (isError === 'loading') {
                    icon = `<svg class="spinner" viewBox="0 0 24 24" width="16" height="16" style="transform-origin:50% 50%;">
                        <circle cx="12" cy="12" r="9" stroke="var(--notif-track)" stroke-width="2.5" fill="none"/>
                        <circle cx="12" cy="12" r="9" stroke="var(--notif-text)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="50" stroke-dashoffset="35"/>
                    </svg>`;
                } else if (isError) {
                    icon = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#d32f2f" stroke-width="2.5">
                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>`;
                } else {
                    icon = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--notif-text)" stroke-width="2.5">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>`;
                }

                const textBlock = `<div style="display:flex;flex-direction:column;gap:2px;">
                    <span style="color: var(--notif-text); font-size:14px; font-weight:500;">${message}</span>
                </div>`;

                toast.innerHTML = `<div style="display:flex;align-items:center;gap:12px;"><div style="display:flex;flex-shrink:0;">${icon}</div>${textBlock}</div>`;

                container.appendChild(toast);
                primeNotificationEntrance(toast);

                void toast.offsetHeight;
                requestAnimationFrame(() => requestAnimationFrame(() => restackNotifications()));

                if (isError === 'loading') {
                    currentLoadingToast = toast;
                    return;
                }
                setTimeout(() => dismissNotification(toast), 3500);
            }

            const container = document.getElementById('notification-container');
            if (container) {
                container.addEventListener('mouseenter', () => {
                    if (!container.classList.contains('has-items')) return;
                    container.classList.add('expanded');
                    applyExpandedLayout();
                });
                container.addEventListener('mouseleave', () => {
                    container.classList.remove('expanded');
                    clearExpandedLayout();
                });
            }

            let activeProgressObj = null;

            function showProgressNotification(message, durationSeconds) {
                const container = document.getElementById('notification-container');
                if (!container) return;

                if (activeProgressObj) {
                    completeProgressNotification('100%');
                }

                const toast = document.createElement('div');
                toast.className = 'notification has-progress';

                const icon = `<svg class="spinner" viewBox="0 0 24 24" width="16" height="16" style="transform-origin:50% 50%;">
                    <circle cx="12" cy="12" r="9" stroke="var(--notif-track)" stroke-width="2.5" fill="none"/>
                    <circle cx="12" cy="12" r="9" stroke="var(--notif-text)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="50" stroke-dashoffset="35"/>
                </svg>`;

                toast.innerHTML = `<div class="notif-top-row"><div style="display:flex;">${icon}</div><span style="color:var(--notif-text);">${message}</span></div>`;

                const barContainer = document.createElement('div');
                barContainer.className = 'notification-progress-container';
                const progressTrack = document.createElement('div');
                progressTrack.className = 'notification-progress-track';
                const progressFill = document.createElement('div');
                progressFill.className = 'notification-progress-fill';
                progressTrack.appendChild(progressFill);
                const progressLabel = document.createElement('div');
                progressLabel.className = 'notification-progress-label';
                progressLabel.textContent = '0%';
                barContainer.appendChild(progressTrack);
                barContainer.appendChild(progressLabel);
                toast.appendChild(barContainer);

                container.appendChild(toast);
                primeNotificationEntrance(toast);

                void toast.offsetHeight;
                requestAnimationFrame(() => requestAnimationFrame(() => restackNotifications()));

                activeProgressObj = { toast, fill: progressFill, label: progressLabel };
            }

            function updateProgressNotification(percent) {
                if (!activeProgressObj) return;
                const p = Math.max(0, Math.min(99, percent));
                activeProgressObj.fill.style.width = p + '%';
                activeProgressObj.label.textContent = Math.floor(p) + '%';
            }

            function completeProgressNotification(finishMessage) {
                if (!activeProgressObj) return;
                const { toast, fill, label } = activeProgressObj;
                const span = toast.querySelector('.notif-top-row span');
                if (span && finishMessage) span.textContent = finishMessage;

                fill.style.transition = 'width 2s cubic-bezier(0.16, 1, 0.3, 1)';
                fill.style.width = '100%';
                if (label) label.textContent = '100%';

                setTimeout(() => dismissNotification(toast), 2000);
                activeProgressObj = null;
            }

            window.showNotification = showNotification;
            window.showProgressNotification = showProgressNotification;
            window.updateProgressNotification = updateProgressNotification;
            window.completeProgressNotification = completeProgressNotification;
        })();
    </script>
